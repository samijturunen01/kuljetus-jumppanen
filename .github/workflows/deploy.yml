name: Julkaise GitHub Pagesiin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Sallitaan yksi julkaisu kerrallaan, keskeneräistä ei keskeytetä.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Projektisivu: samijturunen01.github.io/kuljetus-jumppanen/
      # Vastinpari public/404.html:ssä on pathSegmentsToKeep = 1.
      # Omaa verkkotunnusta käytettäessä poista VITE_BASE ja palauta
      # pathSegmentsToKeep arvoon 0.
      # Yhteydenottolomakkeen julkiset tunnisteet voi antaa myös repon
      # asetuksista (Settings -> Secrets and variables -> Actions -> Variables).
      # Tyhjä arvo ei ohita src/config/forms.js:n arvoa.
      - run: npm run build
        env:
          VITE_BASE: /kuljetus-jumppanen/
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
